{% extends 'control/base.html' %}{% block control_content %}<div class="card card-ums p-4"><div class="control-head"><h4>Reusable message templates</h4><a class="btn btn-primary" href="{% url 'control:template_create' %}">Create template</a></div>{% for t in entries %}<div class="border rounded-3 p-3 mb-3"><h5>{{ t.name }}</h5><p class="control-prose">{{ t.body }}</p><a href="{% url 'control:template_edit' t.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a> <a href="{% url 'control:message_create' %}?template={{ t.pk }}" class="btn btn-sm btn-outline-primary">Use template</a></div>{% empty %}<p class="text-muted">No templates yet.</p>{% endfor %}</div>{% endblock %}
