{% if system_state.status != 'Operational' %}<div class="alert {% if system_state.read_only %}alert-warning{% else %}alert-danger{% endif %} m-3" role="status"><strong>{{ system_state.status }}</strong>{% if system_state.read_only %} — Changes cannot be made at this time.{% endif %}</div>{% endif %}
{% for n in system_banners %}<div class="alert {% if n.priority == 'CRITICAL' %}alert-danger{% elif n.priority == 'HIGH' %}alert-warning{% else %}alert-info{% endif %} m-3" role="status"><strong>{{ n.rendered_title }}</strong><div style="white-space:pre-wrap">{{ n.rendered_body }}</div></div>{% endfor %}
