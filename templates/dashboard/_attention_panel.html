<!-- Attention Required panel. Context: attention_items = [{label, count, url, severity, icon}] -->
<div class="card card-ums mb-4 border-0 shadow-sm">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <div class="fw-bold fs-6">
      <i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Attention Required
    </div>
  </div>
  {% if attention_items %}
  <div class="list-group list-group-flush">
    {% for item in attention_items %}
    <a href="{{ item.url|default:'#' }}" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-2">
        <span class="icon-circle {% if item.severity == 'critical' %}bg-danger bg-opacity-10 text-danger{% elif item.severity == 'warning' %}bg-warning bg-opacity-10 text-warning{% else %}bg-info bg-opacity-10 text-info{% endif %}" style="width:38px;height:38px;">
          <i class="fa-solid {{ item.icon|default:'fa-circle-exclamation' }}"></i>
        </span>
        <span class="fw-semibold text-dark">{{ item.label }}</span>
      </div>
      <span class="badge {% if item.severity == 'critical' %}bg-danger{% elif item.severity == 'warning' %}bg-warning text-dark{% else %}bg-info text-dark{% endif %} rounded-pill px-3 py-2">{{ item.count }}</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="p-4 text-center text-muted">
    <i class="fa-solid fa-circle-check text-success fs-4 mb-2 d-block"></i>
    Nothing needs your attention right now.
  </div>
  {% endif %}
</div>
