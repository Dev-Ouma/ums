<div class="row g-3 mb-4">
  {% for c in cards %}
  <div class="col-6 col-xl-3">
    <a href="{{ c.url|default:'#' }}" class="text-decoration-none d-block h-100">
      <div class="card stat-tile card-lift cursor-pointer h-100" style="background:{{ c.grad }}">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="val text-white">{{ c.value }}</div>
            <div class="lbl mt-1 text-white" style="opacity:0.92;">{{ c.label }}</div>
          </div>
          <span class="fs-3 text-white" style="opacity:0.75;"><i class="fa-solid {{ c.icon }}"></i></span>
        </div>
        {% if c.sub_label %}
        <div class="delta mt-2 text-white d-flex align-items-center" style="opacity:0.95;font-size:0.78rem;">
          {% if c.badge_icon %}<i class="fa-solid {{ c.badge_icon }} me-1"></i>{% endif %}
          <span>{{ c.sub_label }}</span>
        </div>
        {% elif c.delta %}
        <div class="delta mt-2">
          <i class="fa-solid fa-arrow-{% if c.up %}up{% else %}down{% endif %}"></i> {{ c.delta }}
        </div>
        {% endif %}
        <i class="fa-solid {{ c.icon }} ghost"></i>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
