<div class="card card-ums border-0 shadow-sm text-center py-5 px-3">
  <i class="fa-solid {{ icon|default:'fa-inbox' }} fs-1 text-muted opacity-50 mb-3 d-block"></i>
  <div class="fw-bold text-dark mb-1">{{ title|default:"No data available" }}</div>
  <div class="text-muted small mx-auto" style="max-width:420px;">{{ message|default:"There is nothing to show here yet." }}</div>
</div>
