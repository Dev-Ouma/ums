{% if page.has_other_pages %}<nav class="exam-actions no-print" aria-label="Pages">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&term={{ selected_term }}&status={{ selected_status }}&q={{ q|urlencode }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&term={{ selected_term }}&status={{ selected_status }}&q={{ q|urlencode }}">Next</a>{% endif %}</nav>{% endif %}
