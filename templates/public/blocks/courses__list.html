<section class="container py-5">
  {% if block.heading %}<h2 class="fw-bold mb-4">{{ block.heading }}</h2>{% endif %}
  <ul class="list-group list-group-flush">
    {% for c in items %}
      <li class="list-group-item px-0">
        <span class="fw-semibold">{{ c.code }}</span> — {{ c.title }}
      </li>
    {% empty %}<li class="list-group-item px-0 text-muted">No courses yet.</li>{% endfor %}
  </ul>
</section>
