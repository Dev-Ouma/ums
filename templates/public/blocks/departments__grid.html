<section class="container py-5">
  {% if block.heading %}<h2 class="fw-bold text-center mb-4">{{ block.heading }}</h2>{% endif %}
  <div class="row g-4">
    {% for d in items %}
      <div class="col-md-4">
        <div class="card border-0 rounded-4 shadow-sm p-4 h-100">
          <span class="badge badge-soft rounded-pill align-self-start mb-2">{{ d.code }}</span>
          <h5 class="fw-bold mb-0">{{ d.name }}</h5>
        </div>
      </div>
    {% empty %}<p class="text-muted">No departments yet.</p>{% endfor %}
  </div>
</section>
