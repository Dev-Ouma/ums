{% load cms_tags %}
<section class="container py-5">
  {% if block.heading %}<h2 class="fw-bold mb-4">{{ block.heading }}</h2>{% endif %}
  <div class="d-flex flex-column gap-3">
    {% for row in block.body|rows %}
      <div class="d-flex gap-3 align-items-start">
        <span class="fs-4 text-primary"><i class="fa-solid {{ row|cell:2|default:'fa-check' }}"></i></span>
        <div>
          <h6 class="fw-bold mb-1">{{ row|cell:0 }}</h6>
          <p class="text-muted mb-0">{{ row|cell:1 }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
