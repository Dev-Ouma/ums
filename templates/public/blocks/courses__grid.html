<section class="container py-5">
  {% if block.heading %}<h2 class="fw-bold text-center mb-4">{{ block.heading }}</h2>{% endif %}
  <div class="row g-4">
    {% for c in items %}
      <div class="col-md-6 col-lg-4">
        <div class="card border-0 rounded-4 shadow-sm p-4 h-100">
          <span class="badge badge-soft rounded-pill align-self-start mb-2">{{ c.department.code }}</span>
          <h6 class="fw-bold">{{ c.title }}</h6>
          <p class="text-muted small mb-0">{{ c.description|truncatewords:18 }}</p>
        </div>
      </div>
    {% empty %}<p class="text-muted">No courses yet.</p>{% endfor %}
  </div>
</section>
