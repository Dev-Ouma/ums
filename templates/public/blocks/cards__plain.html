{% load cms_tags %}
<section class="container py-5">
  {% if block.heading %}<h2 class="fw-bold text-center mb-4">{{ block.heading }}</h2>{% endif %}
  <div class="row g-4">
    {% for row in block.body|rows %}
      <div class="col-md-4">
        <div class="card border-0 rounded-4 shadow-sm p-4 h-100">
          <h5 class="fw-bold">{{ row|cell:0 }}</h5>
          <p class="text-muted">{{ row|cell:1 }}</p>
          {% if row|cell:3 %}<a href="{{ row|cell:3 }}" class="fw-semibold">Learn more <i class="fa-solid fa-arrow-right ms-1"></i></a>{% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</section>
